<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyTournament</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#09090d;--card:#111118;--card2:#0c0c11;--line:#1d1d28;--ink:#f4f4f7;--mute:#8a8a99;--acc:#9333ea;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Rajdhani,"Segoe UI",system-ui,sans-serif;font-size:16px;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--acc) 30%,transparent);color:var(--acc);display:grid;place-items:center}
.brand{font-weight:700;font-size:19px;flex:1}.brand b{color:var(--acc)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;height:34px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--acc);font-weight:600}
.chip.sq{width:34px;padding:0;justify-content:center}
main{flex:1;overflow-y:auto;padding:16px 14px 20px}
h1{font-size:30px;font-weight:700}h2{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--mute);margin:2px 0 14px}
.ad{height:112px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--mute);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--mute)}
.btns{display:flex;gap:10px;margin-bottom:14px}
.btns button,.pri{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:600;cursor:pointer;flex:1;padding:0 12px}
.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.search{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card2);padding:0 14px;margin-bottom:12px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips button{flex:none;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;cursor:pointer;white-space:nowrap}
.chips .on,.seg .acc{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;color:var(--mute);cursor:pointer;font-weight:600}
.seg .on{background:var(--card2);color:var(--ink)}
.lg{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.lg.top{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.av{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.lb{flex:1;min-width:0}.lt{display:flex;justify-content:space-between;gap:8px}.lt b{font-size:18px}
.code{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;height:fit-content}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;font-size:12px}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.tag.Active{background:color-mix(in srgb,var(--acc) 22%,transparent);color:#c9a3f5}.tag.Upcoming{background:#4b2a6b;color:#e5c9ff}
.meta{font-size:12px;color:var(--mute);display:flex;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vid{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid .th{height:110px;background:linear-gradient(135deg,#1a1a24,#08080b);display:grid;place-items:center;color:var(--mute)}
.vid div.i{padding:10px;font-size:13px}.vid b{font-size:16px;display:block}
.del{color:#ef4444;font-size:12px}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.tips li{list-style:none;margin:8px 0;color:var(--mute);font-size:14px}
.field{display:block;margin:12px 0 6px;font-weight:600}
.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 14px;font-size:16px}
.in:disabled{color:var(--mute)}
.out{width:100%;height:48px;border-radius:14px;border:1px solid #4c1d1d;background:none;color:#ef4444;font-weight:600;cursor:pointer;margin-top:12px}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 10px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav i{font-style:normal;width:38px;height:30px;display:grid;place-items:center;border-radius:12px;font-size:17px}
nav .on{color:var(--acc)}nav .on i{background:color-mix(in srgb,var(--acc) 25%,transparent)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
#sheet{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px 16px;display:none;z-index:30}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pickb{position:relative;overflow:hidden;display:grid;place-items:center;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:600;cursor:pointer;flex:1}
.pickb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:0;cursor:pointer}
.sc{width:56px;flex:none;text-align:center;padding:0}
.tr{display:flex;align-items:center;padding:7px 0;font-size:15px}
.tr>*{width:34px;text-align:center;flex:none}
.tr>.nm{flex:1;width:auto;text-align:left;margin-left:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th{color:var(--mute);font-size:13px;padding:6px 0}
.hd{display:flex;align-items:center;gap:10px;margin:18px 0 12px}.hd i{flex:1;height:1px;background:var(--line)}.hd b{color:var(--acc);font-size:14px;letter-spacing:.5px}
.rn{font-size:14px;color:var(--mute);margin:10px 2px 6px;font-weight:600}
@keyframes pr{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}100%{box-shadow:0 0 0 26px transparent}}
.bans{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:14px;scrollbar-width:none}
.ban{flex:none;width:88%;scroll-snap-align:start;border-radius:20px;padding:18px;min-height:140px;color:#fff}
.ban .tag{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);color:#fff}
.bk{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.bc{min-width:170px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bm{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.br{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:14px}.br+.br{border-top:1px solid var(--line)}
.br.w{background:color-mix(in srgb,var(--acc) 18%,transparent);font-weight:700}
.br .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.cb.me{margin-left:auto;background:var(--acc);border-color:var(--acc);color:#fff}
.cb small{display:block;opacity:.7;font-size:11px;margin-bottom:2px}
.tag.Review{background:#4a3b0b;color:#fde68a}
.view nav,.view header .chip,.view [data-a=back]{display:none}
.mny{border-color:#b8941f!important;background:color-mix(in srgb,#f5c518 7%,var(--card))!important}
.vid .th{overflow:hidden}
details.card>summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none}details.card>summary::after{content:'\25be';float:right;color:var(--mute)}details.card[open]>summary::after{content:'\25b4'}
.tut ol{margin:8px 0 0 18px;color:var(--mute);font-size:14px;line-height:1.5}.tut li{margin:4px 0}.tut svg text{font-family:inherit}
textarea.in{font:inherit;color:inherit}
</style>
</head>
<body>
<header><div class="logo">🎮</div><div class="brand">Easy<b>Tournament</b></div><div class="chip" data-a="coins">🪙 <span id="coins"></span></div><button class="chip sq" data-a="lang" aria-label="Language">文</button><button class="chip sq" data-a="pal" aria-label="Theme color">🎨</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div id="sheet"></div></div><div id="toast"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};var SRV=true;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ACC=["#9333ea","#2563eb","#16a34a","#e11d48"],COL=["#7c3aed","#0ea5e9","#f59e0b","#10b981","#ef4444","#6366f1"];
var D={name:"Joseph Mangire",email:"josephmangire2@gmail.com",coins:29040,acc:0,leagues:[
{n:"DLS Cup Dar es Salaam",c:"DLS99",st:"Active",g:"Dream League Soccer",p:"4/16",d:"01 Feb 2025",mine:1,q:"#1 Quality (86)"},
{n:"NBC Premier League",c:"2SPT9",st:"Active",g:"eFootball",p:"16/16",d:"22 Oct 2025",mine:1,q:"#2 Quality (65)"},
{n:"Pluton league",c:"FM83L",st:"Active",g:"eFootball",p:"8/16",d:"10 Oct 2025",mine:1,q:"#3 Quality (61)"},
{n:"TANZANIA Prison",c:"J5GUZ",st:"Upcoming",g:"eFootball",p:"0/4",d:"05 Nov 2026"},
{n:"NATIONAL Parks",c:"3CGWX",st:"Active",g:"Chess (Rada)",p:"2/4",d:"04 Nov 2026",mine:1},
{n:"HDMPR",c:"DDFU8",st:"Active",g:"Call of Duty Mobile",p:"2/4",d:"07 Nov 2026"},
{n:"AIR HOCKEY",c:"YR827",st:"Active",g:"Air Hockey",p:"2/8",d:"07 Nov 2026",mine:1},
{n:"RTL",c:"WBU7Q",st:"Active",g:"eFootball",p:"4/4",d:"22 Oct 2025"},
{n:"TFF",c:"MDFPM",st:"Active",g:"eFootball",p:"8/8",d:"18 Oct 2025"}]};
try{var r=localStorage.getItem("et");if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("et",JSON.stringify(D))}catch(e){}}
var tab="home",hm="mine",hf="All",hs="",lf="All",mk="wal",mf="All",tt="eFootball";
var TABS=[["home","🏠","Home"],["leagues","🏆","All Leagues"],["market","🏪","Market"],["tut","📖","Tutorials"],["set","⚙️","Settings"]];
var GAMES=["All","eFootball","Dream League Soccer","EA Sports FC","Draft/Checkers","Chess (Rada)","Scrabble","Mortal Kombat","Tic-Tac-Toe (X na O)","Tug of War","Memory Challenge"];
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2200)}
function seg(items,cur,act,cls){return '<div class="seg">'+items.map(function(x){return '<button data-a="'+act+'" data-v="'+esc(x[0])+'" class="'+(cur===x[0]?"on "+(cls||""):"")+'">'+esc(x[1])+'</button>'}).join("")+'</div>'}
function card(l,top){var h=0;for(var i=0;i<l.n.length;i++)h+=l.n.charCodeAt(i);
  return '<div class="lg'+(top?" top":"")+'" data-a="open" data-v="'+esc(l.c)+'" style="cursor:pointer">'+(l.logo?'<img src="'+l.logo+'" alt="" class="av" style="object-fit:cover;background:#fff">':'<div class="av" style="background:'+COL[h%6]+'">'+esc(l.n.slice(0,2).toUpperCase())+'</div>')+'<div class="lb"><div class="lt"><b>'+esc(l.n)+'</b><span class="code">'+esc(l.c)+'</span></div><div class="tags"><span class="tag '+l.st+'">'+l.st+'</span><span class="tag">'+esc(l.g)+'</span>'+(l.q?'<span class="tag">🏆 '+esc(l.q)+'</span>':'')+'</div><div class="meta"><span>👥 '+esc(l.p)+'</span><span>📅 '+esc(l.d)+'</span></div></div></div>'}
function list(){var q=hs.toLowerCase();return D.leagues.filter(function(l){return(hm==="all"||l.mine)&&(hf==="All"||l.g===hf)&&l.n.toLowerCase().indexOf(q)>-1}).map(function(l,i){return card(l,hm==="mine"&&i===0)}).join("")||'<p class="empty">No leagues found</p>'}
function home(){var my=D.leagues.filter(function(l){return l.mine}).length,ac=D.leagues.filter(function(l){return l.st==="Active"}).length;
  return '<h1>Hello, '+esc(D.name.split(" ")[0])+' 👋</h1><p class="sub">Plan and manage your tournaments</p><div class="ad">📢 Ad space – go Premium to remove ads</div>'+
  '<div class="stats"><div class="stat"><b>'+my+'</b><span>My Leagues</span></div><div class="stat"><b>'+ac+'</b><span>Active</span></div><div class="stat"><b>'+D.leagues.length+'</b><span>All</span></div></div>'+
  '<div class="btns"><button class="pri" data-a="new">＋ Create New League</button><button data-a="join">Join with Code</button></div>'+
  '<input class="search" id="hs" placeholder="Search leagues by name..." value="'+esc(hs)+'"><div class="chips">'+GAMES.map(function(g){return '<button data-a="hf" data-v="'+esc(g)+'" class="'+(hf===g?"on":"")+'">'+esc(g)+'</button>'}).join("")+'</div>'+
  seg([["mine","My Leagues"],["all","All"]],hm,"hm")+'<div id="hl">'+list()+'</div>'}
function leagues(){var f=D.leagues.filter(function(l){return lf==="All"||(lf==="eFootball"?l.g==="eFootball":l.g==="Dream League Soccer")});
  return '<h2>All Leagues</h2><p class="sub">Browse and join any league</p>'+seg([["All","All ("+D.leagues.length+")"],["eFootball","eFootball"],["DLS","DLS"]],lf,"lf")+f.map(function(l){return card(l)}).join("")}
function market(){var h='<h2>🏪 Players Market</h2><p class="sub">Sell and share your gameplay videos</p>'+seg([["wal","Wallet"],["acc","Accounts"],["vid","Videos"],["mine","Mine"]],mk,"mk");
  var fl='<div class="btns" style="margin-bottom:12px"><button class="pri" data-a="soon">'+(mk==="vid"?"⬆ Upload Video":"🏷 Sell Account")+'</button>'+["All","eF8","DLS"].map(function(x){return '<button style="flex:0 0 52px'+(mf===x?";background:var(--acc);border-color:var(--acc);color:#fff":"")+'" data-a="mf" data-v="'+x+'">'+x+'</button>'}).join("")+'</div>';
  if(mk==="acc")return h+fl+'<div class="card"><div style="display:flex;gap:10px"><div class="logo" style="width:42px;height:42px">🎮</div><div style="flex:1"><b style="font-size:18px">eFootball</b><div class="sub" style="margin:0;font-size:13px">Seller: Joseph Mangire</div><div style="color:#f59e0b">★★★★★ <small>5.0 (3)</small></div></div></div><div style="display:flex;gap:6px;margin:12px 0"><div class="vid th" style="flex:1;height:60px"></div><div class="vid th" style="flex:1;height:60px"></div><div class="vid th" style="flex:1;height:60px"></div></div><div class="meta"><span style="color:var(--acc)">★ OVR 3372</span></div><p>Clearly</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><b style="color:var(--acc);font-size:20px">25,000 USD</b><span class="tag">Your account</span></div></div>';
  if(mk==="vid")return h+fl+'<div class="row2">'+[["Singida","Hf"],["Machines","B"]].map(function(v){return '<div class="vid"><div class="th">▶</div><div class="i"><div style="display:flex;justify-content:space-between"><b>'+v[0]+'</b><small style="color:var(--acc)">eFootball</small></div><small>'+v[1]+'</small><p style="color:var(--mute);margin:6px 0">Joseph Mangire &nbsp; 👁 0 &nbsp; ♡ 0</p><span class="del">🗑 Delete</span></div></div>'}).join("")+'</div>';
  return h+[["DLS99","1,000","Sold"],["DLS99","5,000","For sale"],["efootball","5,000","For sale"]].map(function(a){return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+a[0]+'</b><span class="tag">'+a[2]+'</span></div><small style="color:var(--mute)">'+a[1]+' USD</small></div>'}).join("")+'<h2 style="font-size:18px;margin:14px 0">🛒 My Purchases</h2><p class="empty">You have not bought any account yet.</p>'}
function tut(){return '<div class="stats"><div class="stat"><b>0</b><span>All Tutorials</span></div><div class="stat"><b>0</b><span>eFootball</span></div><div class="stat"><b>0</b><span>DLS</span></div></div><div class="btns"><button class="'+(tt==="eFootball"?"pri":"")+'" data-a="tt" data-v="eFootball">🎮 eFootball</button><button class="'+(tt==="DLS"?"pri":"")+'" data-a="tt" data-v="DLS">⚡ DLS</button></div><h2 style="font-size:18px;margin:14px 0">☆ '+tt+' Tutorials</h2><div class="card empty"><div style="font-size:40px">🎮</div><b style="color:var(--ink)">No tutorials yet</b><br>Wait for tutorials to be added.</div><div class="card"><b>Quick Tips</b><ul class="tips"><li>⚡ Use R1/RB to sprint with players</li><li>🎯 Finesse shot with L2+R2 for more accuracy</li><li>🛡 Press X/A at the right time to tackle without a card</li><li>📐 Use a suitable formation – 4-3-3 is good for beginners</li></ul></div>'}
function set(){return '<h2>👤 Settings</h2><p class="sub">Update your personal info</p><div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="border-radius:50%;width:56px;height:56px;background:color-mix(in srgb,var(--acc) 30%,var(--card2))">'+esc(D.name.charAt(0).toUpperCase())+'</div><div><b style="font-size:18px">'+esc(D.name)+'</b><div class="sub" style="margin:0;font-size:13px">'+esc(D.email)+'</div></div></div><label class="field" for="fn">Full Name</label><input class="in" id="fn" value="'+esc(D.name)+'" maxlength="40"><label class="field" for="fe">Email</label><input class="in" id="fe" value="'+esc(D.email)+'" disabled><button class="pri" style="width:100%;margin-top:16px" data-a="save">Save Changes</button></div><button class="out" data-a="out">⎋ Log Out</button>'}
function render(){$("coins").textContent="$"+D.coins.toLocaleString("en-US");document.documentElement.style.setProperty("--acc",ACC[D.acc]);
  $("app").innerHTML=det?detail():({home:home,leagues:leagues,market:function(){return mk==="wal"?walletV():mk==="vid"?videosV():market()},tut:tut,set:set})[tab]();
  $("nav").innerHTML=TABS.map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'"><i>'+t[1]+'</i>'+t[2]+'</button>'}).join("")}
function modal(m){var s=$("sheet");
  s.innerHTML=m==="new"?'<h2 style="margin-bottom:8px">Create New League</h2><label class="field" for="mn">League name</label><input class="in" id="mn" maxlength="40"><label class="field" for="mg">Game</label><select class="in" id="mg">'+GAMES.slice(1).map(function(g){return '<option>'+esc(g)+'</option>'}).join("")+'</select><label class="field" for="mp">Max players</label><select class="in" id="mp"><option>4</option><option>8</option><option>16</option><option>32</option></select><button class="pri" style="width:100%;margin-top:16px" data-a="mnew">Create</button>':
  '<h2 style="margin-bottom:8px">Join with Code</h2><label class="field" for="mc">League code</label><input class="in" id="mc" maxlength="8" style="text-transform:uppercase"><button class="pri" style="width:100%;margin-top:16px" data-a="mjoin">Join</button>';
  $("modal").classList.add("open");var f=s.querySelector("input");if(f)f.focus()}
function close(){$("modal").classList.remove("open")}
document.addEventListener("click",function(e){
  if(e.target===$("modal"))return close();
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v;
  if(a==="tab"){tab=v;det=null;render();$("app").scrollTop=0}
  else if(a==="hm"){hm=v;render()}else if(a==="hf"){hf=v;render()}else if(a==="lf"){lf=v;render()}
  else if(a==="mk"){mk=v;render()}else if(a==="mf"){mf=v;render()}else if(a==="tt"){tt=v;render()}
  else if(a==="pal"){D.acc=(D.acc+1)%ACC.length;save();render()}
  else if(a==="lang"||a==="soon"){toast("Coming soon")}
